# Lychee configuration file
# Documentation: https://github.com/lycheeverse/lychee#configuration-file

# Maximum number of retries per link
max_retries = 3

# Maximum number of concurrent requests
max_concurrency = 10

# User agent string
user_agent = "Mozilla/5.0 (compatible; Lychee/0.15; +https://github.com/lycheeverse/lychee)"

# Accept these HTTP status codes as valid.
# 429 (too many requests) and 503 (service unavailable) say that the server
# is busy or down for now, not that the page is gone: WWU's Banner schedule
# page answered 503 for hours during a maintenance window (2026-10-23).
accept = [200, 201, 202, 203, 204, 206, 301, 302, 303, 307, 308, 429, 503]

# Timeout per request (in seconds)
timeout = 20

# Exclude local addresses, which only resolve on the author's machine
exclude = [
  "http://localhost.*",
  "https://localhost.*",
  "http://127.0.0.1.*",
  "https://127.0.0.1.*",
  # quarto.org is a trusted site but may be unreachable from CI runners
  "https://quarto.org/.*",
  # These pages load in a browser but answer CI's link checker with
  # 403 Forbidden (checked by hand 2026-10-23).
  "https://www.acm.org/code-of-ethics",
  "https://www.wwu.edu/dean-students",
]
