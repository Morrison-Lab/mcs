# Thin caller of Morrison-Lab/gha's multi-part exercise check,
# copied from gha's examples/check-multipart-exercises.yml (gha#1230).
#
# Why it exists: no repo here called the check, so a self-test PR
# (Morrison-Lab/mcs#168) wrote twelve multi-part exercises that only
# the automated review caught.
#
# Diff-scoped check: fails when a PR adds or revises an exercise div (#exr-...)
# that holds more than one part (lettered, roman or numbered items, or inline
# (a) ... (b)). Every multi-part exercise is split into separate divs, each with
# its own solution. <!-- multipart-ok: reason --> exempts one exercise.
# Only contents:read is needed; the job states it so zizmor and CodeQL pass.
name: Check multi-part exercises

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  check:
    permissions:
      contents: read
    uses: Morrison-Lab/gha/.github/workflows/check-multipart-exercises.yml@v3
    # with:
    #   globs: '*.qmd'                         # pathspecs to check (recursive)
    #   paths-ignore: 'chapters/outtakes/**'   # skip known-noisy paths
    #   fail: false                            # warn instead of block (defaults to true)
    #   whole-tree: true                       # scan every exercise, not just those a PR touches
